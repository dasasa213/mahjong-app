spring:
  datasource:
    # ローカルではテストDB専用ユーザーを使用する。
    # 本番では DB_URL / DB_USERNAME / DB_PASSWORD を環境変数で明示する。
    url: ${DB_URL:jdbc:mysql://mahjongdb.cr2u8q2keo25.ap-southeast-2.rds.amazonaws.com:3306/mahjong_test?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo}
    username: ${DB_USERNAME:mahjong_test_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  # BootのErrorPageFilterを完全に無効化（ダブり保険）
  main:
    allow-bean-definition-overriding: false

server:
  port: 8080
  servlet:
    context-path: /mahjong-deploy
    session:
      timeout: 24h

logging:
  charset:
    console: UTF-8
    file: UTF-8
