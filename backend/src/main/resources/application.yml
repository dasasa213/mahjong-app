spring:
  datasource:
    # ローカルでは mahjong_test、本番では環境変数 DB_URL で mahjong を指定する。
    url: ${DB_URL:jdbc:mysql://mahjongdb.cr2u8q2keo25.ap-southeast-2.rds.amazonaws.com:3306/mahjong_test?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  # BootのErrorPageFilterを完全に無効化（ダブり保険）
  main:
    allow-bean-definition-overriding: false

server:
  port: 8080
  servlet:
    context-path: /mahjong-deploy
    session:
      timeout: 24h

logging:
  charset:
    console: UTF-8
    file: UTF-8
